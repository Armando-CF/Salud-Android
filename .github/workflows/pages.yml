# Compila Savia Web (carpeta web/) y la publica en GitHub Pages en cada push a la rama principal.
# Requisitos (una sola vez):
#   1. GitHub Pages gratis requiere que el repositorio sea público (o un plan de pago si es privado).
#   2. En el repositorio: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
name: Publicar Savia Web en GitHub Pages

on:
  push:
    branches: [Main]
    paths:
      - 'web/**'
      - 'app/src/main/assets/atlas.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
