<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app ocupa toda la pantalla del iPhone; los márgenes seguros se manejan con env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Savia</title>
    <meta name="description" content="Tu bitácora de salud privada. Todo se guarda solo en tu dispositivo." />

    <!-- PWA en iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Savia" />
    <meta name="application-name" content="Savia" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#1B6B58" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello (el ajuste real vive en IndexedDB; esto es solo caché visual).
      (function () {
        try {
          var m = localStorage.getItem('savia-theme') || 'system';
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Savia necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
